name: Release

# ⛔ 已禁用（2026-07-12 二轮复验 §七）：本文件在 workflows-disabled/ 下，GitHub 不会执行。
# 此前只改成 workflow_dispatch + 注释"先过安全门禁"——但注释不是门禁，手动触发仍能
# 直接构建签名发布，与 README「发布流水线已停」矛盾。冻结期彻底移出生效目录；
# 若解冻重新分发：①先修已知安全问题 ②加真实失败的安全 gate + 受保护 environment
# 人工审批 ③再移回 .github/workflows/（见合并计划 v2.0 条件轨）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci
        working-directory: app

      - name: Configure updater endpoint
        run: node scripts/configure-updater-endpoint.js --require
        env:
          AI_PM_UPDATER_ENDPOINT: ${{ secrets.AI_PM_UPDATER_ENDPOINT || 'https://k3tty5555.github.io/AI_PM/latest.json' }}

      - name: Verify signing key
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "✅ TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)"
          else
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is NOT set"
            exit 1
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"
          else
            echo "⚠️  TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and release (macOS universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: AI PM ${{ github.ref_name }}
          releaseBody: '请见提交历史（本仓无 CHANGELOG 文件） 了解此版本变更。'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
          includeUpdaterJson: true

      - name: Sign and upload updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ github.ref_name }}"
          find app/src-tauri/target/release/bundle -type f 2>/dev/null | head -30
          BUNDLE=$(find "$PWD/app/src-tauri/target" -name "*.app.tar.gz" -not -name "*.sig" | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "❌ No .app.tar.gz found"; exit 1
          fi
          echo "Signing: $BUNDLE"
          cd app && npx tauri signer sign -- "$BUNDLE"
          gh release upload "$TAG" "${BUNDLE}.sig" --clobber

  build-windows:
    needs: [build-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci
        working-directory: app

      - name: Configure updater endpoint
        shell: bash
        run: node scripts/configure-updater-endpoint.js --require
        env:
          AI_PM_UPDATER_ENDPOINT: ${{ secrets.AI_PM_UPDATER_ENDPOINT || 'https://k3tty5555.github.io/AI_PM/latest.json' }}

      - name: Verify signing key
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "✅ TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)"
          else
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is NOT set"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and release (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: AI PM ${{ github.ref_name }}
          releaseBody: '请见提交历史（本仓无 CHANGELOG 文件） 了解此版本变更。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Sign and upload updater bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ github.ref_name }}"
          find app/src-tauri/target/release/bundle -type f 2>/dev/null | head -30
          BUNDLE=$(find "$PWD/app/src-tauri/target" -name "*.nsis.zip" -not -name "*.sig" | head -1)
          if [ -z "$BUNDLE" ]; then
            BUNDLE=$(find "$PWD/app/src-tauri/target" -name "*.msi.zip" -not -name "*.sig" | head -1)
          fi
          # Tauri v2 doesn't auto-generate .nsis.zip — create it from .exe
          NSIS_EXE=$(find "$PWD/app/src-tauri/target/release/bundle/nsis" -name "*.exe" | head -1)
          if [ -n "$NSIS_EXE" ]; then
            NSIS_ZIP="${NSIS_EXE%.exe}.nsis.zip"
            echo "Creating updater bundle: $NSIS_ZIP"
            # Convert Git Bash path (/d/a/...) to Windows path (D:\a\...) for PowerShell
            WIN_EXE=$(cygpath -w "$NSIS_EXE")
            WIN_ZIP=$(cygpath -w "$NSIS_ZIP")
            powershell -Command "Compress-Archive -Path '$WIN_EXE' -DestinationPath '$WIN_ZIP' -Force"
            echo "Signing: $NSIS_ZIP"
            cd app && npx tauri signer sign -- "$NSIS_ZIP"
            gh release upload "$TAG" "$NSIS_ZIP" "${NSIS_ZIP}.sig" --clobber
          else
            echo "❌ No NSIS .exe found"
            exit 1
          fi

  update-manifest:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate and deploy latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p /tmp/deploy /tmp/sigs

          # Download .sig files (non-fatal if missing)
          gh release download "$TAG" --pattern "*.sig" --dir /tmp/sigs 2>/dev/null || true

          # Read signatures (empty string if not found)
          SIG_MAC=$(cat /tmp/sigs/*app.tar.gz.sig 2>/dev/null || echo "")
          SIG_WIN=$(cat /tmp/sigs/*nsis.zip.sig 2>/dev/null || cat /tmp/sigs/*msi.zip.sig 2>/dev/null || echo "")

          # Determine updater asset names
          MAC_ASSET=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.app\.tar\.gz$' | head -1)
          WIN_ASSET=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.nsis\.zip$' | head -1)
          if [ -z "$WIN_ASSET" ]; then
            WIN_ASSET=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.msi\.zip$' | head -1)
          fi

          # Fallback asset names
          MAC_ASSET="${MAC_ASSET:-AI.PM_universal.app.tar.gz}"
          WIN_ASSET="${WIN_ASSET:-AI.PM_${VERSION}_x64-setup.nsis.zip}"

          cat > /tmp/deploy/latest.json <<ENDJSON
          {
            "version": "${VERSION}",
            "notes": "更新至 ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG_MAC}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${MAC_ASSET}"
              },
              "darwin-x86_64": {
                "signature": "${SIG_MAC}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${MAC_ASSET}"
              },
              "windows-x86_64": {
                "signature": "${SIG_WIN}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${WIN_ASSET}"
              }
            }
          }
          ENDJSON

          echo "Generated latest.json:"
          cat /tmp/deploy/latest.json

          if [ -z "$SIG_MAC" ] && [ -z "$SIG_WIN" ]; then
            echo "⚠️  No signatures found. Auto-updater will not work until signing is configured."
          fi

      - name: Deploy latest.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/deploy
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
