# Include inside the existing HTTPS server block.
location ^~ /aipm/ {
    alias /srv/aipm/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    if ($arg_aipm_write_token != "") {
        add_header Set-Cookie "aipm_access=$arg_aipm_write_token; Path=/aipm; HttpOnly; SameSite=Lax; Secure" always;
        return 302 $scheme://$host$uri;
    }
    limit_except GET HEAD { deny all; }
    auth_request /__aipm_auth__;
    auth_request_set $aipm_set_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $aipm_set_cookie always;
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        font/woff woff;
        font/woff2 woff2;
    }
}

location = /__aipm_auth__ {
    internal;
    proxy_pass http://127.0.0.1:8876/__aipm_auth__;
    proxy_set_header X-AIPM-Path $request_uri;
    proxy_set_header X-AIPM-Access-Token $arg_aipm_write_token;
    proxy_set_header Cookie $http_cookie;
}

location = /__aipm_feedback__ {
    proxy_pass http://127.0.0.1:8876;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}

location = /__aipm_health__ {
    proxy_pass http://127.0.0.1:8876;
    proxy_set_header Host $host;
    limit_except GET HEAD { deny all; }
}
